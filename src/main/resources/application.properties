spring.application.name=taskmanger

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY:<paste openssl rand -base64 32 output here>}
security.jwt.expiration-time=3600000
spring.config.import=optional:file:.env[.properties]

# Default admin account, created on startup if missing
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.admin.email=${ADMIN_EMAIL:admin@taskmanager.local}
