spring.application.name=taskmanger

# hosting platforms such as Railway pass the port to listen on in PORT
server.port=${PORT:8080}

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY:<paste openssl rand -base64 32 output here>}
security.jwt.expiration-time=604800000
spring.config.import=optional:file:.env[.properties]



# Database (PostgreSQL). Put DB_PASSWORD in .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
