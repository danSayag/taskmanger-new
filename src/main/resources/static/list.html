<html>
<head>
    <script src="./javascript/guard.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks &middot; List</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/screens.css">
</head>

<body>

<div class="container">
    <div class="board">
        <div class="topbar">
            <label id="task-label">Tasks</label>
            <a href="./index.html" class="view-tab">Board</a>
            <a href="./list.html" class="view-tab is-active">List</a>
            <input type="search" id="search" placeholder="Search tasks...">
            <a href="#new-task" id="new-task-btn" class="btn btn-primary">+ New task</a>
        </div>

        <div class="list-view">

            <div class="list-toolbar">
                <button class="btn" type="button">Status <strong>All</strong> &#9662;</button>
                <button class="btn" type="button">Priority <strong>All</strong> &#9662;</button>
                <button class="btn" type="button">Sort <strong>Due date</strong> &#8593;</button>
                <a href="./list.html" class="btn btn-link">Clear filters</a>
                <span id="result-count">Showing 0 of 0</span>
            </div>

            <table id="task-list">
                <thead>
                    <tr>
                        <th class="col-check"></th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Due &#8593;</th>
                        <th class="col-hide">Updated</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <div class="list-footer">
                <span class="rows-per-page">
                    Rows per page:
                    <select>
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                </span>
                <nav class="pager">
                    <a href="#">&#8249; Prev</a>
                    <a href="#" class="is-current">1</a>
                    <a href="#">2</a>
                    <a href="#">Next &#8250;</a>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- ============ New task modal ============ -->
<div class="modal" id="new-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2>New task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="new-title">Title <span class="req">*</span></label>
            <input type="text" id="new-title">
            <p class="field-error">Title is required</p>
        </div>

        <div class="field">
            <label for="new-desc">Description</label>
            <textarea id="new-desc" placeholder="Optional details&hellip;"></textarea>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="new-status">Status</label>
                <select id="new-status">
                    <option>TODO</option>
                    <option>IN PROGRESS</option>
                    <option>DONE</option>
                </select>
            </div>
            <div class="field">
                <label for="new-priority">Priority</label>
                <select id="new-priority">
                    <option>LOW</option>
                    <option selected>MEDIUM</option>
                    <option>HIGH</option>
                </select>
            </div>
            <div class="field">
                <label for="new-due">Due date</label>
                <input type="date" id="new-due">
            </div>
        </div>

        <div class="dialog-foot">
            <a href="#" class="btn spacer">Cancel</a>
            <button type="button" class="btn btn-primary">Create task</button>
        </div>
    </div>
</div>

<!-- ============ Edit task modal ============ -->
<div class="modal" id="edit-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2>Edit task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="edit-title">Title <span class="req">*</span></label>
            <input type="text" id="edit-title">
        </div>

        <div class="field">
            <label for="edit-desc">Description</label>
            <textarea id="edit-desc"></textarea>
        </div>

        <div class="field">
            <label>Status</label>
            <div class="segmented">
                <input type="radio" name="edit-status" id="st-todo">
                <label for="st-todo">To do</label>
                <input type="radio" name="edit-status" id="st-prog" checked>
                <label for="st-prog">In progress</label>
                <input type="radio" name="edit-status" id="st-done">
                <label for="st-done">Done</label>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label>Priority</label>
                <div class="segmented">
                    <input type="radio" name="edit-priority" id="pr-low">
                    <label for="pr-low">Low</label>
                    <input type="radio" name="edit-priority" id="pr-med" checked>
                    <label for="pr-med">Med</label>
                    <input type="radio" name="edit-priority" id="pr-high">
                    <label for="pr-high">High</label>
                </div>
            </div>
            <div class="field">
                <label for="edit-due">Due date</label>
                <input type="date" id="edit-due">
            </div>
        </div>

        <p class="form-meta"></p>

        <div class="dialog-foot">
            <a href="#delete-task" class="btn btn-link-danger">Delete</a>
            <a href="#" class="btn spacer">Cancel</a>
            <button type="button" class="btn btn-primary">Save</button>
        </div>
    </div>
</div>

<!-- ============ Delete confirmation ============ -->
<div class="modal" id="delete-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog dialog-confirm">
        <div class="dialog-head">
            <h2>Delete task?</h2>
        </div>
        <p>This task will be permanently deleted. This can&rsquo;t be undone.</p>
        <div class="dialog-foot">
            <a href="#" class="btn spacer">Cancel</a>
            <a href="#deleted" class="btn btn-danger">Delete</a>
        </div>
    </div>
</div>


<!-- ============ Success toast (shown after Delete) ============ -->
<div class="toast toast-target" id="deleted">Task deleted</div>

</body>
</html>
