<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks &middot; Sign up</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/screens.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-page">

<form class="auth-card" id="signup-form" novalidate>
    <h1>Create account</h1>

    <div class="field">
        <label for="signup-username">Username <span class="req">*</span></label>
        <input type="text" id="signup-username" autocomplete="username" required>
    </div>

    <div class="field">
        <label for="signup-email">Email <span class="req">*</span></label>
        <input type="email" id="signup-email" autocomplete="email" required>
    </div>

    <div class="field">
        <label for="signup-password">Password <span class="req">*</span></label>
        <input type="password" id="signup-password" autocomplete="new-password" minlength="8" required>
    </div>

    <div class="field">
        <label for="signup-confirm">Confirm password <span class="req">*</span></label>
        <input type="password" id="signup-confirm" autocomplete="new-password" required>
    </div>

    <p class="auth-error" id="auth-error"></p>
    <button type="submit" class="btn btn-primary">Create account</button>

    <p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p>
</form>

<script src="./javascript/auth.js"></script>
</body>
</html>
