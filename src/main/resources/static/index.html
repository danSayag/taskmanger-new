<html>
<head>
    <script src="./javascript/guard.js"></script>
    <meta charset="utf-8">
    <script src="./javascript/i18n.js"></script>
    <script src="./javascript/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="title.board">Tasks</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/screens.css">
    <link rel="stylesheet" href="./css/jira.css">
    <link rel="stylesheet" href="./css/sidebar.css">
</head>

<body>

<div class="container">
    <div class="board">
        <div class="topbar">
            <label id="task-label" data-i18n="nav.brand">Tasks</label>
            <a href="./index.html" class="view-tab is-active" data-i18n="nav.board">Board</a>
            <a href="./list.html" class="view-tab" data-i18n="nav.list">List</a>
            <a href="./messages.html" class="view-tab" data-i18n="nav.messages">Messages</a>
            <input type="search" id="search" placeholder="Search tasks..." data-i18n-placeholder="search.tasks">
            <a href="#new-task" id="new-task-btn" class="btn btn-primary" data-i18n="btn.newTask">+ New task</a>
            <button type="button" class="btn" id="logout-btn" onclick="logout()" data-i18n="nav.logout">Log out</button>
        </div>

        <div class="board-view">

            <div class="top-main-view">
                <div class="filters">
                    <div id="priority-container" class="filter-pill">
                        <span data-i18n="filter.priority">Priority</span>
                        <select id="priority-selector">
                            <option value="all" data-i18n="filter.all">All</option>
                            <option value="high" data-i18n="priority.high">High</option>
                            <option value="medium" data-i18n="priority.medium">Medium</option>
                            <option value="low" data-i18n="priority.low">Low</option>
                        </select>
                    </div>
                    <div id="due-container" class="filter-pill">
                        <span data-i18n="filter.due">Due</span>
                        <select id="Due">
                            <option value="any" data-i18n="due.any">Any time</option>
                            <option value="today" data-i18n="due.today">Today</option>
                            <option value="next-week" data-i18n="due.nextWeek">Next Week</option>
                            <option value="next-month" data-i18n="due.nextMonth">Next month</option>
                            <option value="next-year" data-i18n="due.nextYear">Next year</option>
                        </select>
                    </div>
                </div>
                <span id="task-count"></span>
            </div>

            <div id="task-board">
                <section class="column" data-status="todo">
                    <header class="column-head">
                        <span class="dot dot-todo"></span>
                        <h2 data-i18n="status.todo">To do</h2>
                        <span class="column-count" id="todo-count">0</span>
                    </header>
                    <div class="column-content" id="todo-content">

                        </div>
                    <a href="#new-task" class="add-task" data-i18n="btn.addTask">+ Add task</a>
                </section>

                <section class="column" data-status="inprogress">
                    <header class="column-head">
                        <span class="dot dot-inprogress"></span>
                        <h2 data-i18n="status.inprogress">In progress</h2>
                        <span class="column-count" id="inprogress-count">0</span>
                    </header>
                    <div class="column-content" id="inprogress-content">
                        </div>
                    <a href="#new-task" class="add-task" data-i18n="btn.addTask">+ Add task</a>
                </section>

                <section class="column" data-status="done">
                    <header class="column-head">
                        <span class="dot dot-done"></span>
                        <h2 data-i18n="status.done">Done</h2>
                        <span class="column-count" id="done-count">0</span>
                    </header>
                    <div class="column-content" id="done-content">
                        </div>
                    <a href="#new-task" class="add-task" data-i18n="btn.addTask">+ Add task</a>
                </section>
            </div>
            <!--cards added dynamically via javascript-->
        </div>

    </div>
</div>

<!-- ============ New task modal ============ -->
<div class="modal" id="new-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2 data-i18n="modal.newTask">New task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="new-title"><span data-i18n="field.title">Title</span> <span class="req">*</span></label>
            <input type="text" id="new-title">
        </div>

        <div class="field">
            <label for="new-desc" data-i18n="field.description">Description</label>
            <textarea id="new-desc" placeholder="Optional details&hellip;" data-i18n-placeholder="field.descPlaceholder"></textarea>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="new-status" data-i18n="field.status">Status</label>
                <select id="new-status">
                    <option value="TODO" data-i18n="status.TODO">TODO</option>
                    <option value="IN_PROGRESS" data-i18n="status.IN_PROGRESS">IN PROGRESS</option>
                    <option value="DONE" data-i18n="status.DONE">DONE</option>
                </select>
            </div>
            <div class="field">
                <label for="new-priority" data-i18n="field.priority">Priority</label>
                <select id="new-priority">
                    <option value="LOW" data-i18n="priority.LOW">LOW</option>
                    <option value="MEDIUM" selected data-i18n="priority.MEDIUM">MEDIUM</option>
                    <option value="HIGH" data-i18n="priority.HIGH">HIGH</option>
                </select>
            </div>
            <div class="field">
                <label for="new-due" data-i18n="field.dueDate">Due date</label>
                <input type="date" id="new-due">
            </div>
        </div>

        <div class="dialog-foot">
            <a href="#" class="btn spacer" data-i18n="btn.cancel">Cancel</a>
            <button type="button" class="btn btn-primary" onclick="submitNewTask()" data-i18n="btn.createTask">Create task</button>
        </div>
    </div>
</div>

<!-- ============ Edit task modal ============ -->
<div class="modal" id="edit-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2 data-i18n="modal.editTask">Edit task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="edit-title"><span data-i18n="field.title">Title</span> <span class="req">*</span></label>
            <input type="text" id="edit-title">
        </div>

        <div class="field">
            <label for="edit-desc" data-i18n="field.description">Description</label>
            <textarea id="edit-desc"></textarea>
        </div>

        <div class="field">
            <label data-i18n="field.status">Status</label>
            <div class="segmented">
                <input type="radio" name="edit-status" id="st-todo">
                <label for="st-todo" data-i18n="status.todo">To do</label>
                <input type="radio" name="edit-status" id="st-prog" checked>
                <label for="st-prog" data-i18n="status.inprogress">In progress</label>
                <input type="radio" name="edit-status" id="st-done">
                <label for="st-done" data-i18n="status.done">Done</label>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label data-i18n="field.priority">Priority</label>
                <div class="segmented">
                    <input type="radio" name="edit-priority" id="pr-low">
                    <label for="pr-low" data-i18n="priority.low">Low</label>
                    <input type="radio" name="edit-priority" id="pr-med" checked>
                    <label for="pr-med" data-i18n="priority.med">Med</label>
                    <input type="radio" name="edit-priority" id="pr-high">
                    <label for="pr-high" data-i18n="priority.high">High</label>
                </div>
            </div>
            <div class="field">
                <label for="edit-due" data-i18n="field.dueDate">Due date</label>
                <input type="date" id="edit-due">
            </div>
        </div>

        <p class="form-meta"></p>

        <div class="dialog-foot">
            <a href="#delete-task" class="btn btn-link-danger" data-i18n="btn.delete">Delete</a>
            <a href="#" class="btn spacer" data-i18n="btn.cancel">Cancel</a>
            <button type="button" class="btn btn-primary" onclick="submitEditTask()" data-i18n="btn.save">Save</button>
        </div>
    </div>
</div>

<!-- ============ Delete confirmation ============ -->
<div class="modal" id="delete-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog dialog-confirm">
        <div class="dialog-head">
            <h2 data-i18n="modal.deleteTask">Delete task?</h2>
        </div>
        <p id="delete-message" data-i18n="modal.deleteMessage">This task will be permanently deleted. This can&rsquo;t be undone.</p>
        <div class="dialog-foot">
            <a href="#" class="btn spacer" data-i18n="btn.cancel">Cancel</a>
            <a href="#deleted" class="btn btn-danger" onclick="confirmDelete()" data-i18n="btn.delete">Delete</a>
        </div>
    </div>
</div>


<!-- ============ Success toast (shown after Delete) ============ -->
<div class="toast toast-target" id="deleted" data-i18n="toast.taskDeleted">Task deleted</div>
<script src="./javascript/common.js"></script>
<script src="./javascript/sidebar.js"></script>
<script src="./javascript/script.js"></script>
</body>
</html>
