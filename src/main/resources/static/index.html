<html>
<head>
    <script src="./javascript/guard.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/screens.css">
</head>

<body>

<div class="container">
    <div class="board">
        <div class="topbar">
            <label id="task-label">Tasks</label>
            <a href="./index.html" class="view-tab is-active">Board</a>
            <a href="./list.html" class="view-tab">List</a>
            <a href="./messages.html" class="view-tab">Messages</a>
            <input type="search" id="search" placeholder="Search tasks...">
            <a href="#new-task" id="new-task-btn" class="btn btn-primary">+ New task</a>
            <button type="button" class="btn" id="logout-btn" onclick="logout()">Log out</button>
        </div>

        <div class="board-view">

            <div class="top-main-view">
                <div class="filters">
                    <div id="priority-container" class="filter-pill">
                        <span>Priority</span>
                        <select id="priority-selector">
                            <option value="all">All</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div id="due-container" class="filter-pill">
                        <span>Due</span>
                        <select id="Due">
                            <option value="any">Any time</option>
                            <option value="today">Today</option>
                            <option value="next-week">Next Week</option>
                            <option value="next-month">Next month</option>
                            <option value="next-year">Next year</option>
                        </select>
                    </div>
                </div>
                <span id="task-count">0 tasks</span>
            </div>

            <div id="task-board">
                <section class="column" data-status="todo">
                    <header class="column-head">
                        <span class="dot dot-todo"></span>
                        <h2>To do</h2>
                        <span class="column-count" id="todo-count">0</span>
                    </header>
                    <div class="column-content" id="todo-content">

                        </div>
                    <a href="#new-task" class="add-task">+ Add task</a>
                </section>

                <section class="column" data-status="inprogress">
                    <header class="column-head">
                        <span class="dot dot-inprogress"></span>
                        <h2>In progress</h2>
                        <span class="column-count" id="inprogress-count">0</span>
                    </header>
                    <div class="column-content" id="inprogress-content">
                        </div>
                    <a href="#new-task" class="add-task">+ Add task</a>
                </section>

                <section class="column" data-status="done">
                    <header class="column-head">
                        <span class="dot dot-done"></span>
                        <h2>Done</h2>
                        <span class="column-count" id="done-count">0</span>
                    </header>
                    <div class="column-content" id="done-content">
                        </div>
                    <a href="#new-task" class="add-task">+ Add task</a>
                </section>
            </div>
            <!--cards added dynamically via javascript-->
        </div>

    </div>
</div>

<!-- ============ New task modal ============ -->
<div class="modal" id="new-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2>New task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="new-title">Title <span class="req">*</span></label>
            <input type="text" id="new-title">
        </div>

        <div class="field">
            <label for="new-desc">Description</label>
            <textarea id="new-desc" placeholder="Optional details&hellip;"></textarea>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="new-status">Status</label>
                <select id="new-status">
                    <option value="TODO">TODO</option>
                    <option value="IN_PROGRESS">IN PROGRESS</option>
                    <option value="DONE">DONE</option>
                </select>
            </div>
            <div class="field">
                <label for="new-priority">Priority</label>
                <select id="new-priority">
                    <option>LOW</option>
                    <option selected>MEDIUM</option>
                    <option>HIGH</option>
                </select>
            </div>
            <div class="field">
                <label for="new-due">Due date</label>
                <input type="date" id="new-due">
            </div>
        </div>

        <div class="dialog-foot">
            <a href="#" class="btn spacer">Cancel</a>
            <button type="button" class="btn btn-primary" onclick="submitNewTask()">Create task</button>
        </div>
    </div>
</div>

<!-- ============ Edit task modal ============ -->
<div class="modal" id="edit-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog">
        <div class="dialog-head">
            <h2>Edit task</h2>
            <a class="dialog-close" href="#">&#10005;</a>
        </div>

        <div class="field">
            <label for="edit-title">Title <span class="req">*</span></label>
            <input type="text" id="edit-title">
        </div>

        <div class="field">
            <label for="edit-desc">Description</label>
            <textarea id="edit-desc"></textarea>
        </div>

        <div class="field">
            <label>Status</label>
            <div class="segmented">
                <input type="radio" name="edit-status" id="st-todo">
                <label for="st-todo">To do</label>
                <input type="radio" name="edit-status" id="st-prog" checked>
                <label for="st-prog">In progress</label>
                <input type="radio" name="edit-status" id="st-done">
                <label for="st-done">Done</label>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label>Priority</label>
                <div class="segmented">
                    <input type="radio" name="edit-priority" id="pr-low">
                    <label for="pr-low">Low</label>
                    <input type="radio" name="edit-priority" id="pr-med" checked>
                    <label for="pr-med">Med</label>
                    <input type="radio" name="edit-priority" id="pr-high">
                    <label for="pr-high">High</label>
                </div>
            </div>
            <div class="field">
                <label for="edit-due">Due date</label>
                <input type="date" id="edit-due">
            </div>
        </div>

        <p class="form-meta"></p>

        <div class="dialog-foot">
            <a href="#delete-task" class="btn btn-link-danger">Delete</a>
            <a href="#" class="btn spacer">Cancel</a>
            <button type="button" class="btn btn-primary" onclick="submitEditTask()">Save</button>
        </div>
    </div>
</div>

<!-- ============ Delete confirmation ============ -->
<div class="modal" id="delete-task">
    <a class="modal-backdrop" href="#"></a>
    <div class="dialog dialog-confirm">
        <div class="dialog-head">
            <h2>Delete task?</h2>
        </div>
        <p id="delete-message">This task will be permanently deleted. This can&rsquo;t be undone.</p>
        <div class="dialog-foot">
            <a href="#" class="btn spacer">Cancel</a>
            <a href="#deleted" class="btn btn-danger" onclick="confirmDelete()">Delete</a>
        </div>
    </div>
</div>


<!-- ============ Success toast (shown after Delete) ============ -->
<div class="toast toast-target" id="deleted">Task deleted</div>
<script src="./javascript/common.js"></script>
<script src="./javascript/script.js"></script>
</body>
</html>
