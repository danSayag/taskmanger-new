spring.application.name=taskmanger

# Tests run against an in-memory H2 database (Flyway applies the real migrations), so no PostgreSQL is needed
spring.datasource.url=jdbc:h2:mem:taskmanger-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# a fixed test-only key (base64 of 32 bytes); never used outside tests
security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci10YXNrbWFuZ2VyLTEyMzQ1
security.jwt.expiration-time=3600000
